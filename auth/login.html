<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SACCOPay | Secure Login</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        /* Custom Base CSS matching the requested theme */
        :root {
            --neon-green: #00ff66;
            --dark-bg: #050608;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        
        body {
            background-color: var(--dark-bg);
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Complex Background with Green Glows */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 255, 102, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(0, 255, 102, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(0, 255, 102, 0.05) 0%, transparent 60%);
            pointer-events: none;
        }

        /* Recreating the cybernetic line pattern */
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            opacity: 0.1;
            background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M 0 0 L 80 0 80 80' fill='none' stroke='%23ffffff' stroke-width='0.5'/%3E%3Cpath d='M 40 40 Q 60 20 80 40 T 120 40' fill='none' stroke='%2300ff66' stroke-width='1' opacity='0.5'/%3E%3Cpath d='M 40 45 Q 60 25 80 45 T 120 45' fill='none' stroke='%2300ff66' stroke-width='1' opacity='0.2'/%3E%3C/svg%3E");
            background-size: 80px 80px;
            pointer-events: none;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
            width: 100%;
            max-width: 450px;
            padding: 50px 40px;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .text-neon {
            color: var(--neon-green) !important;
            text-shadow: 0 0 15px rgba(0, 255, 102, 0.5);
        }

        .btn-neon {
            background-color: var(--neon-green);
            color: #000;
            font-weight: 700;
            border-radius: 16px;
            padding: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.5);
            border: none;
            letter-spacing: 0.5px;
            width: 100%;
            font-size: 1.1rem;
        }

        .btn-neon:hover {
            background-color: #00cc52;
            color: #000;
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.7);
            transform: translateY(-2px);
        }

        /* Mode Toggles */
        .auth-mode-container {
            background: rgba(0, 0, 0, 0.3); border-radius: 16px;
            padding: 5px; display: flex; margin-bottom: 30px;
            border: 1px solid var(--glass-border);
        }
        .mode-btn {
            flex: 1; border: none; background: transparent; color: #888;
            padding: 10px; border-radius: 12px; font-weight: 600; font-size: 0.9rem;
            transition: 0.3s;
        }
        .mode-btn.active {
            background: var(--neon-green); color: #000;
            box-shadow: 0 4px 15px rgba(0, 255, 102, 0.2);
        }

        /* Inputs */
        .form-control {
            background: rgba(0, 0, 0, 0.3); border: 1px solid var(--glass-border); color: #fff;
            border-radius: 14px; padding: 15px 18px; transition: 0.3s;
        }
        .form-control:focus {
            background: rgba(0, 0, 0, 0.5); border-color: var(--neon-green); color: #fff;
            box-shadow: 0 0 0 4px rgba(0, 255, 102, 0.1);
            outline: none;
        }
        .form-control::placeholder { color: #555; }
        .input-group-text { background: rgba(0, 0, 0, 0.3); border: 1px solid var(--glass-border); color: #888; border-radius: 14px; }

        /* PIN Dots styling */
        .pin-container { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 20px; }
        .pin-input {
            width: 100%; max-width: 65px; height: 75px; font-size: 2rem; font-weight: 800; text-align: center;
            background: rgba(255, 255, 255, 0.05); color: var(--neon-green); border: 1px solid var(--glass-border);
            border-radius: 14px; transition: 0.3s;
        }
        .pin-input:focus { border-color: var(--neon-green); background: rgba(0,255,102,0.05); outline: none; box-shadow: 0 0 15px rgba(0,255,102,0.2); transform: scale(1.05); }

        /* Modals */
        .modal-content { background: rgba(10, 12, 16, 0.95); backdrop-filter: blur(25px); border: 1px solid var(--neon-green); border-radius: 24px; color: white;}
    </style>
</head>
<body>

    <div class="glass-card">
        <div class="text-center mb-5">
            <a href="#" class="d-inline-flex align-items-center text-decoration-none mb-3">
                <i class="bi bi-wallet2 fs-2 me-2 text-neon"></i>
                <span class="fs-3 fw-bold text-white">SACCO<span class="text-neon">Pay</span></span>
            </a>
            <h4 class="fw-bold mb-1">Welcome Back</h4>
            <p style="color: #888; font-size: 0.9rem;">Please secure your session to continue.</p>
        </div>

        <div class="auth-mode-container">
            <button class="mode-btn active" id="btn-password" onclick="switchMode('password')">Password</button>
            <button class="mode-btn" id="btn-pin" onclick="switchMode('pin')">Secure PIN</button>
        </div>

        <form onsubmit="event.preventDefault(); handleLogin();">
            
            <div class="mb-4">
                <label class="small fw-medium text-muted mb-2 text-uppercase" style="letter-spacing: 1px;">Identifier (Phone or Email)</label>
                <input type="text" class="form-control" placeholder="e.g. 0712345678" required>
            </div>

            <div id="password-fields">
                <div class="mb-2">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <label class="small fw-medium text-muted mb-0 text-uppercase" style="letter-spacing: 1px;">Password</label>
                        <a href="#" class="text-neon text-decoration-none small fw-bold" data-bs-toggle="modal" data-bs-target="#recoveryModal">Forgot?</a>
                    </div>
                    <div class="input-group">
                        <input type="password" class="form-control border-end-0" id="passInput" placeholder="Enter your password">
                        <span class="input-group-text border-start-0" style="cursor: pointer;" onclick="togglePass()">
                            <i class="bi bi-eye" id="eyeIcon"></i>
                        </span>
                    </div>
                </div>
            </div>

            <div id="pin-fields" class="d-none">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <label class="small fw-medium text-muted text-uppercase" style="letter-spacing: 1px;">Enter 4-Digit PIN</label>
                    <a href="#" class="text-neon text-decoration-none small fw-bold" data-bs-toggle="modal" data-bs-target="#recoveryModal">Reset PIN</a>
                </div>
                <div class="pin-container">
                    <input type="password" class="pin-input" maxlength="1" onkeyup="moveFocus(this, 'p2')">
                    <input type="password" class="pin-input" maxlength="1" id="p2" onkeyup="moveFocus(this, 'p3')">
                    <input type="password" class="pin-input" maxlength="1" id="p3" onkeyup="moveFocus(this, 'p4')">
                    <input type="password" class="pin-input" maxlength="1" id="p4">
                </div>
            </div>

            <div class="form-check mb-4 mt-4">
                <input class="form-check-input border-neon" type="checkbox" id="rememberMe" checked style="background-color: rgba(0,0,0,0.3);">
                <label class="form-check-label text-muted small" for="rememberMe">Trust this device for 30 days</label>
            </div>

            <button type="submit" class="btn-neon mb-4" id="loginBtn">
                <span class="d-none spinner-border spinner-border-sm me-2 text-dark" id="loginSpinner"></span>
                Secure Login
            </button>

            <p class="text-center text-muted small mb-0">
                New to the platform? <a href="#" class="text-white fw-bold text-decoration-none" onclick="alert('Redirecting to Sign Up page...')">Create an account</a>
            </p>
        </form>
    </div>

    <div class="modal fade" id="recoveryModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 p-4 shadow-lg">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold text-white">Recover Access</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted small mb-4">Enter your registered phone number. We'll send an OTP to verify your identity and reset your credentials.</p>
                    <div class="mb-4">
                        <label class="small text-muted mb-2 text-uppercase">Phone Number</label>
                        <input type="tel" class="form-control" placeholder="07XX XXX XXX">
                    </div>
                    <button class="btn-neon w-100" onclick="alert('OTP sent! Redirecting to verification...');">Send Recovery Code</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="successModal" tabindex="-1" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content text-center p-4 border-0">
                <div class="rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3" style="width: 60px; height: 60px; background: rgba(0,255,102,0.1); color: var(--neon-green);">
                    <i class="bi bi-shield-check" style="font-size: 2rem;"></i>
                </div>
                <h5 class="fw-bold text-white mb-1">Authenticated</h5>
                <p class="text-muted small mb-0">Synchronizing your ledger data...</p>
                <div class="spinner-border spinner-border-sm text-neon mx-auto mt-3" role="status"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Switch between Password and PIN mode
        function switchMode(mode) {
            const passBtn = document.getElementById('btn-password');
            const pinBtn = document.getElementById('btn-pin');
            const passFields = document.getElementById('password-fields');
            const pinFields = document.getElementById('pin-fields');

            if(mode === 'password') {
                passBtn.classList.add('active');
                pinBtn.classList.remove('active');
                passFields.classList.remove('d-none');
                pinFields.classList.add('d-none');
            } else {
                pinBtn.classList.add('active');
                passBtn.classList.remove('active');
                pinFields.classList.remove('d-none');
                passFields.classList.add('d-none');
                document.querySelector('.pin-input').focus();
            }
        }

        // Auto-focus next PIN input
        function moveFocus(current, nextId) {
            if(current.value.length >= 1) {
                document.getElementById(nextId).focus();
            }
        }

        // Password visibility toggle
        function togglePass() {
            const input = document.getElementById('passInput');
            const icon = document.getElementById('eyeIcon');
            if(input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('bi-eye', 'bi-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('bi-eye-slash', 'bi-eye');
            }
        }

        // Handle Login Submission
        // Handle Login Submission
                // Handle Login Submission
                function handleLogin() {
                    window.location.href = './onboarding.html';
                }
    </script>
</body>
</html>
